<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visualización Feynman - Detalle L2</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: transparent; font-family: sans-serif; }
        canvas { display: block; }
        .label { position: absolute; font-size: 1.1em; pointer-events: none; }
    </style>
    <script>window.MathJax = { tex: { inlineMath: [['$', '$']] }, svg: { fontCache: 'global' } };</script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="labels"></div>
    <script type="module">
        import { ThreeComponents } from './js/three-components.js';
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 5, 25);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Colores Monokai
        const PURPLE = 0xae81ff; // Tramo 2
        const WHITE = 0xffffff;
        const offsetX = -6; 
        const L1 = 7.5, L2 = 4.5, r = 9;

        scene.add(new THREE.AmbientLight(0xffffff, 1.0));
        ThreeComponents.createSmallWhiteAxes(scene, new THREE.Vector3(offsetX - 2, -L1 - 2, 0), 1.2);

        // 1. Barra (Parte L2 en Morado, L1 en Blanco)
        const barRad = 0.12;
        const barL2 = new THREE.Mesh(new THREE.CylinderGeometry(barRad, barRad, L2, 16), new THREE.MeshPhongMaterial({ color: PURPLE }));
        barL2.position.set(offsetX, L2/2, 0);
        scene.add(barL2);
        const barL1 = new THREE.Mesh(new THREE.CylinderGeometry(barRad, barRad, L1, 16), new THREE.MeshPhongMaterial({ color: WHITE, opacity: 0.3, transparent: true }));
        barL1.position.set(offsetX, -L1/2, 0);
        scene.add(barL1);

        // 2. Elementos Resolución L2 (Morado)
        const l2_val = L2 * 0.4;
        const dqPoint = new THREE.Mesh(new THREE.SphereGeometry(0.2, 32, 32), new THREE.MeshPhongMaterial({ color: PURPLE }));
        dqPoint.position.set(offsetX, l2_val, 0);
        scene.add(dqPoint);

        const d2Line = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(offsetX, l2_val, 0), new THREE.Vector3(offsetX + r, 0, 0)]),
            new THREE.LineDashedMaterial({ color: PURPLE, dashSize: 0.15, gapSize: 0.1, opacity: 0.8, transparent: true })
        );
        d2Line.computeLineDistances();
        scene.add(d2Line);

        const originP = new THREE.Vector3(offsetX + r, 0, 0);
        const dirE2 = new THREE.Vector3(r, -l2_val, 0).normalize();
        scene.add(new THREE.ArrowHelper(dirE2, originP, 5, PURPLE, 1, 0.4));

        const alpha = Math.atan2(l2_val, r);
        const arc = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(new THREE.EllipseCurve(0, 0, 2.5, 2.5, 0, -alpha, true, 0).getPoints(50)),
            new THREE.LineBasicMaterial({ color: PURPLE, opacity: 0.8, transparent: true })
        );
        arc.position.copy(originP);
        scene.add(arc);

        // 3. Enunciado (Blanco)
        const rLine = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(offsetX, 0, 0), new THREE.Vector3(offsetX + r + 5, 0, 0)]),
            new THREE.LineDashedMaterial({ color: WHITE, dashSize: 0.15, gapSize: 0.1, opacity: 0.4, transparent: true })
        );
        rLine.computeLineDistances();
        scene.add(rLine);
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(0.25, 32, 32), new THREE.MeshPhongMaterial({ color: WHITE })).position.copy(originP));

        const labels = [
            { text: "$L_2$", pos: new THREE.Vector3(offsetX - 1.2, L2/2, 0), color: "#ae81ff" },
            { text: "$L_1$", pos: new THREE.Vector3(offsetX - 1.2, -L1/2, 0), color: "#ffffff" },
            { text: "$l_2$", pos: new THREE.Vector3(offsetX + 0.8, l2_val/2, 0), color: "#ae81ff" },
            { text: "$d_2$", pos: new THREE.Vector3(offsetX + r/2, l2_val/2 + 1, 0), color: "#ae81ff" },
            { text: "$r$", pos: new THREE.Vector3(offsetX + r/2, -0.8, 0), color: "#ffffff" },
            { text: "$P$", pos: new THREE.Vector3(offsetX + r + 0.8, 0.8, 0), color: "#ffffff" },
            { text: "$\\vec{E}_2$", pos: originP.clone().add(dirE2.clone().multiplyScalar(5.5)), color: "#ae81ff" },
            { text: "$\\alpha_2$", pos: new THREE.Vector3(offsetX + r + 3.2, -0.8, 0), color: "#ae81ff" }
        ];

        const container = document.getElementById('labels');
        labels.forEach(l => {
            const div = document.createElement('div');
            div.className = 'label'; div.innerHTML = l.text; div.style.color = l.color;
            container.appendChild(div); l.el = div;
        });

        function animate() {
            requestAnimationFrame(animate); controls.update();
            labels.forEach(l => {
                const v = l.pos.clone().project(camera);
                l.el.style.transform = `translate(-50%, -50%) translate(${(v.x*0.5+0.5)*window.innerWidth}px, ${(-(v.y*0.5)+0.5)*window.innerHeight}px)`;
            });
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
