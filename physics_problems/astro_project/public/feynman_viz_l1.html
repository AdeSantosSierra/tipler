<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualización Feynman - Detalle L1</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: transparent; font-family: sans-serif; }
        canvas { display: block; }
        .label { position: absolute; font-size: 1.1em; pointer-events: none; }
    </style>
    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$']] }, svg: { fontCache: 'global' } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="labels"></div>
    <script type="module">
        import { ThreeComponents } from './js/three-components.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, -5, 25);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(10, 10, 10);
        scene.add(dirLight);

        const MONOKAI_YELLOW = 0xe6db74;
        const WHITE = 0xffffff;
        const offsetX = -6; 

        const L1 = 10, L2 = 6, r = 12;
        const totalL = L1 + L2;
        const l1_val = -L1 * 0.4; 

        ThreeComponents.createSmallWhiteAxes(scene, new THREE.Vector3(offsetX - 2, -L1 - 2, 0), 1.5);

        // 1. Barra (Blanco)
        const barGeo = new THREE.CylinderGeometry(0.12, 0.12, totalL, 16);
        const barMat = new THREE.MeshPhongMaterial({ color: WHITE, emissive: 0x333333 });
        const bar = new THREE.Mesh(barGeo, barMat);
        bar.position.set(offsetX, (L2 - L1) / 2, 0);
        scene.add(bar);

        // 2. Línea r (Blanco)
        const dashedWhiteMat = new THREE.LineDashedMaterial({ color: WHITE, dashSize: 0.15, gapSize: 0.1, opacity: 0.6, transparent: true });
        const rLineGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(offsetX, 0, 0),
            new THREE.Vector3(offsetX + r + 5, 0, 0)
        ]);
        const rLine = new THREE.Line(rLineGeo, dashedWhiteMat);
        rLine.computeLineDistances();
        scene.add(rLine);

        // 3. Ángulo Recto (Blanco)
        const sqSize = 0.8;
        const rightAngleLine = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(offsetX + sqSize, 0, 0),
                new THREE.Vector3(offsetX + sqSize, -sqSize, 0),
                new THREE.Vector3(offsetX, -sqSize, 0)
            ]),
            new THREE.LineBasicMaterial({ color: WHITE, opacity: 0.5, transparent: true })
        );
        scene.add(rightAngleLine);

        // 4. Punto dq (Amarillo)
        const dqPoint = new THREE.Mesh(new THREE.SphereGeometry(0.2, 32, 32), new THREE.MeshPhongMaterial({ color: MONOKAI_YELLOW }));
        dqPoint.position.set(offsetX, l1_val, 0);
        scene.add(dqPoint);

        // 5. Hipotenusa d1 (Amarillo)
        const d1Line = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(offsetX, l1_val, 0), new THREE.Vector3(offsetX + r, 0, 0)]),
            new THREE.LineDashedMaterial({ color: MONOKAI_YELLOW, dashSize: 0.15, gapSize: 0.1, opacity: 0.8, transparent: true })
        );
        d1Line.computeLineDistances();
        scene.add(d1Line);

        // 6. Vector E1 (Amarillo)
        const originP = new THREE.Vector3(offsetX + r, 0, 0);
        const dirE1 = new THREE.Vector3(r, -l1_val, 0).normalize();
        const arrowE1 = new THREE.ArrowHelper(dirE1, originP, 5, MONOKAI_YELLOW, 1, 0.4);
        scene.add(arrowE1);

        // 7. Arco para alpha1 (Rotado 180º: a la derecha de P, entre Eje X y E1)
        const alpha = Math.atan2(Math.abs(l1_val), r);
        // El arco va desde 0 (Eje X positivo desde P) hacia +alpha (E1)
        const curve = new THREE.EllipseCurve(0, 0, 2.5, 2.5, 0, alpha, false, 0);
        const arcPoints = curve.getPoints(50);
        const arcLine = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(arcPoints),
            new THREE.LineBasicMaterial({ color: MONOKAI_YELLOW, opacity: 0.8, transparent: true })
        );
        arcLine.position.copy(originP);
        scene.add(arcLine);

        // 8. Punto P (Blanco)
        const pointP = new THREE.Mesh(new THREE.SphereGeometry(0.25, 32, 32), new THREE.MeshPhongMaterial({ color: WHITE }));
        pointP.position.copy(originP);
        scene.add(pointP);

        const labelsContainer = document.getElementById('labels');
        const labelSpecs = [
            { text: "$L_1$", pos: new THREE.Vector3(offsetX - 1.2, -L1/2 - 1, 0), color: "#ffffff" },
            { text: "$L_2$", pos: new THREE.Vector3(offsetX - 1.2, L2/2 + 1, 0), color: "#ffffff" },
            { text: "$l_1$", pos: new THREE.Vector3(offsetX + 0.8, l1_val/2, 0), color: "#e6db74" },
            { text: "$d_1$", pos: new THREE.Vector3(offsetX + r/2, l1_val/2 - 1, 0), color: "#e6db74" },
            { text: "$r$", pos: new THREE.Vector3(offsetX + r/2, 0.8, 0), color: "#ffffff" },
            { text: "$P$", pos: new THREE.Vector3(offsetX + r + 0.8, -0.6, 0), color: "#ffffff" },
            { text: "$\\vec{E}_1$", pos: originP.clone().add(dirE1.clone().multiplyScalar(5.5)), color: "#e6db74" },
            { text: "$\\alpha_1$", pos: new THREE.Vector3(offsetX + r + 3.2, 0.8, 0), color: "#e6db74" }
        ];

        labelSpecs.forEach(l => {
            const div = document.createElement('div');
            div.className = 'label';
            div.innerHTML = l.text;
            div.style.color = l.color;
            labelsContainer.appendChild(div);
            l.element = div;
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            labelSpecs.forEach(l => {
                const vector = l.pos.clone();
                vector.project(camera);
                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(vector.y * 0.5) + 0.5) * window.innerHeight;
                l.element.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
                l.element.style.display = (vector.z > 1) ? 'none' : 'block';
            });
            renderer.render(scene, camera);
        }
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        animate();
    </script>
</body>
</html>
