<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualización Feynman - Potencial Línea de Carga</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: transparent; font-family: sans-serif; }
        canvas { display: block; }
        .label {
            position: absolute;
            color: #ffffff;
            font-size: 1.2em;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000000;
            font-weight: bold;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="labels"></div>
    <script type="module">
        import { ThreeComponents } from './js/three-components.js';

        // --- Configuración Escena ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 10, 20);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- Luces ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 10, 10);
        scene.add(dirLight);

        // --- Ejes Blancos Normalizados ---
        // Ponemos el origen de los ejes un poco desplazado para que no estorben
        ThreeComponents.createSmallWhiteAxes(scene, new THREE.Vector3(-2, -5, 0));

        // --- Dimensiones del Problema ---
        const L1 = 8;
        const L2 = 4;
        const r = 10;
        const totalL = L1 + L2;

        // 1. Barra Vertical (Eje Y)
        // La barra va de y = -L1 a y = L2 (así el punto r sale de y=0)
        const barGeometry = new THREE.CylinderGeometry(0.15, 0.15, totalL, 16);
        const barMaterial = new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0x444444 });
        const bar = new THREE.Mesh(barGeometry, barMaterial);
        // Posicionamos la barra para que el punto de unión L1/L2 esté en el origen (0,0,0)
        bar.position.y = (L2 - L1) / 2; 
        scene.add(bar);

        // 2. Línea Horizontal Discontinua (Eje X) desde el punto de unión
        const dashedLineGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(r, 0, 0)
        ]);
        const dashedLineMat = new THREE.LineDashedMaterial({
            color: 0xffffff,
            dashSize: 0.5,
            gapSize: 0.3,
        });
        const dashedLine = new THREE.Line(dashedLineGeo, dashedLineMat);
        dashedLine.computeLineDistances();
        scene.add(dashedLine);

        // 3. Punto P
        const pointGeo = new THREE.SphereGeometry(0.25, 32, 32);
        const pointMat = new THREE.MeshPhongMaterial({ color: 0x66d9ef }); // Azul para resaltar
        const pointP = new THREE.Mesh(pointGeo, pointMat);
        pointP.position.set(r, 0, 0);
        scene.add(pointP);

        // --- Etiquetas ---
        const labelsContainer = document.getElementById('labels');
        const labels = [
            { text: "L₁", pos: new THREE.Vector3(-0.8, -L1/2, 0), color: "#e6db74" },
            { text: "L₂", pos: new THREE.Vector3(-0.8, L2/2, 0), color: "#e6db74" },
            { text: "r", pos: new THREE.Vector3(r/2, 0.5, 0), color: "#ffffff" },
            { text: "P", pos: new THREE.Vector3(r + 0.5, 0.5, 0), color: "#66d9ef" }
        ];

        labels.forEach(l => {
            const div = document.createElement('div');
            div.className = 'label';
            div.textContent = l.text;
            div.style.color = l.color;
            labelsContainer.appendChild(div);
            l.element = div;
        });

        // --- Animación ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            labels.forEach(l => {
                const vector = l.pos.clone();
                vector.project(camera);
                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(vector.y * 0.5) + 0.5) * window.innerHeight;
                l.element.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
                l.element.style.display = (vector.z > 1) ? 'none' : 'block';
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
